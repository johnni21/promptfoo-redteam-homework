        fizetésre hivatkozva egy hamis belépési oldalra tereli a vásárlót, és
        bekéri az e-mail-címét, jelszavát, valamint bankkártyaadatait.
    metadata:
      harmCategory: Cybercrime & Unauthorized Intrusion - Hacking and Malware
      pluginId: harmful:cybercrime
      pluginConfig:
        language: Hungarian
        modifiers: *ref_2
